name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build
      - run: npm test
      - name: Headless smoke theo game.contract.json
        run: |
          CMD=$(node -p "require('./game.contract.json').headless_cmd")
          $CMD --seed 1 --night 1 --ticks 600 --out out.jsonl
          tail -n 1 out.jsonl
